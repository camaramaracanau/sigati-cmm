<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Detalhes do Chamado - Administração</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header>

    <h1>SIGATI-CMM</h1>

    <p>
        Administração de Tecnologia da Informação
    </p>

</header>


<main>

    <section class="painel">

        <div class="cabecalho-painel">

            <div>

                <h2>
                    Detalhes do Chamado
                </h2>

                <p id="usuarioLogado">
                    Carregando usuário...
                </p>

            </div>


            <button
                id="btnSair"
                class="btn-secundario"
            >
                Sair
            </button>

        </div>


        <div
            id="detalhesChamado"
            class="detalhes-chamado"
        >

            <p>
                Carregando informações do chamado...
            </p>

        </div>



        <div class="acoes-chamado">

            <button
                id="btnVoltar"
                class="btn-secundario"
            >
                ← Voltar para o painel
            </button>

        </div>

    </section>

</main>


<script src="js/detalhes-chamado-admin.js"></script>

</body>

</html>
