<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel do Usuário - SIGATI-CMM</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <h1>SIGATI-CMM</h1>

    <p>Área do Usuário</p>

</header>

<main>

<section class="painel">

    <div class="cabecalho-painel">

        <div>

            <h2>Painel do Usuário</h2>

            <p id="usuarioLogado">
                Carregando usuário...
            </p>

        </div>

        <button
            id="btnSair"
            class="btn-secundario"
        >
            Sair
        </button>

    </div>


    <section class="lista-painel">

        <h3>Atendimento de TI</h3>

        <div class="botoes">

            <a
                href="abrir-chamado.html"
                class="botao"
            >
                📝 Abrir chamado
            </a>

            <a
                href="meus-chamados.html"
                class="botao"
            >
                📋 Meus chamados
            </a>

        </div>

    </section>


    <section class="lista-painel">

        <h3>Avisos da TI</h3>

        <div class="card-resumo">

            <p>
                Nenhum aviso da Tecnologia da Informação no momento.
            </p>

        </div>

    </section>

</section>

</main>


<script src="js/painel-usuario.js"></script>

</body>

</html>
